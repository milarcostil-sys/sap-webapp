<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ARCOSTEEL - Item Image</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #000000;

    color: #ffffff;

    overflow: hidden;

}


/* =========================================================
   PAGE
========================================================= */

.viewer-page {

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000000;

}


/* =========================================================
   VIEWER
========================================================= */

.viewer {

    width: min(
        98vw,
        1100px
    );

    height: min(
        96vh,
        900px
    );

    display: flex;

    flex-direction: column;

    background: #000000;

}


/* =========================================================
   TOP INFO
========================================================= */

.viewer-top {

    min-height: 60px;

    display: flex;

    align-items: center;

    justify-content: flex-start;

    padding:
        14px
        24px
        6px;

    background: #000000;

}

.item-info {

    display: flex;

    flex-direction: column;

    gap: 3px;

}

.item-label {

    font-size: 10px;

    color: #6f6f6f;

}

.item-code {

    font-size: 19px;

    font-weight: 700;

    color: #ffffff;

    direction: ltr;

    text-align: right;

}


/* =========================================================
   IMAGE AREA - WHITE CANVAS
========================================================= */

.image-area {

    flex: 1;

    min-height: 0;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: auto;

    padding:
        18px;

    margin:
        0
        14px;

    background: #ffffff;

    border-radius: 10px;

}


/* =========================================================
   IMAGE
========================================================= */

#itemImage {

    display: none;

    max-width: 100%;

    max-height: 100%;

    width: auto;

    height: auto;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

    transform-origin: center center;

    transition:
        transform 0.12s ease;

}


/* =========================================================
   LOADING
========================================================= */

.loading {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    color: #666666;

    font-size: 14px;

    white-space: nowrap;

}


/* =========================================================
   NO IMAGE
========================================================= */

.no-image {

    display: none;

    text-align: center;

    color: #666666;

}

.no-image-icon {

    font-size: 54px;

    margin-bottom: 10px;

}

.no-image-text {

    font-size: 15px;

}


/* =========================================================
   FOOTER
========================================================= */

.viewer-footer {

    min-height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    padding:
        8px
        10px;

    background: #000000;

}


/* =========================================================
   ZOOM BUTTONS
========================================================= */

.zoom-btn {

    width: 40px;

    height: 36px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 0;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.12
        );

    border-radius: 9px;

    background: #111111;

    color: #ffffff;

    font-size: 17px;

    cursor: pointer;

    transition:
        background 0.15s ease,
        transform 0.15s ease;

}

.zoom-btn:hover {

    background: #222222;

}

.zoom-btn:active {

    transform: scale(0.96);

}

.zoom-level {

    min-width: 54px;

    text-align: center;

    color: #d0d0d0;

    font-size: 13px;

    direction: ltr;

}


/* =========================================================
   MOBILE
========================================================= */

@media
(max-width: 600px) {

    .viewer {

        width: 100%;

        height: 100%;

    }


    .viewer-top {

        min-height: 52px;

        padding:
            10px
            14px
            4px;

    }


    .item-code {

        font-size: 17px;

    }


    .image-area {

        margin:
            0
            6px;

        padding: 10px;

        border-radius: 8px;

    }


    .viewer-footer {

        min-height: 50px;

        gap: 6px;

    }


    .zoom-btn {

        width: 38px;

        height: 34px;

    }

}

</style>

</head>


<body>


<div class="viewer-page">


    <div class="viewer">


        <!-- =================================================
             ITEM CODE
        ================================================== -->

        <div class="viewer-top">


            <div class="item-info">

                <div class="item-label">
                    מק״ט
                </div>

                <div
                    class="item-code"
                    id="itemCode"
                >
                    -
                </div>

            </div>


        </div>


        <!-- =================================================
             IMAGE AREA
        ================================================== -->

        <div class="image-area">


            <div
                class="loading"
                id="loading"
            >
                טוען תמונה...
            </div>


            <img
                id="itemImage"
                alt="Item image"
                draggable="false"
            >


            <div
                class="no-image"
                id="noImage"
            >

                <div class="no-image-icon">
                    🖼️
                </div>

                <div class="no-image-text">
                    לא נמצאה תמונה לפריט
                </div>

            </div>


        </div>


        <!-- =================================================
             ZOOM
        ================================================== -->

        <div class="viewer-footer">


            <button
                class="zoom-btn"
                type="button"
                onclick="zoomOut()"
                title="הקטן"
            >
                −
            </button>


            <div
                class="zoom-level"
                id="zoomLevel"
            >
                120%
            </div>


            <button
                class="zoom-btn"
                type="button"
                onclick="zoomIn()"
                title="הגדל"
            >
                +
            </button>


            <button
                class="zoom-btn"
                type="button"
                onclick="resetZoom()"
                title="איפוס"
            >
                ↺
            </button>


        </div>


    </div>


</div>


<script src="config.js"></script>


<script>

/* =========================================================
   SETTINGS
========================================================= */

let currentZoom = 1.2;

const DEFAULT_ZOOM = 1.2;

const ZOOM_STEP = 0.2;

const MIN_ZOOM = 1;

const MAX_ZOOM = 4;


/* =========================================================
   URL PARAMETER
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const itemCode =
    (
        params.get("item") || ""
    ).trim();


document
    .getElementById(
        "itemCode"
    )
    .textContent =
        itemCode || "-";


/* =========================================================
   DOM
========================================================= */

const loadingElement =
    document.getElementById(
        "loading"
    );

const imageElement =
    document.getElementById(
        "itemImage"
    );

const noImageElement =
    document.getElementById(
        "noImage"
    );

const zoomLevelElement =
    document.getElementById(
        "zoomLevel"
    );


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadItemImage() {


    if (!itemCode) {

        showNoImage();

        return;

    }


    const imageUrl =
        API_BASE +
        "/item-image/" +
        encodeURIComponent(
            itemCode
        );


    imageElement.onload =
        function() {

            loadingElement.style.display =
                "none";

            noImageElement.style.display =
                "none";

            imageElement.style.display =
                "block";

            resetZoom();

        };


    imageElement.onerror =
        function() {

            showNoImage();

        };


    imageElement.src =
        imageUrl;

}


/* =========================================================
   NO IMAGE
========================================================= */

function showNoImage() {

    loadingElement.style.display =
        "none";

    imageElement.style.display =
        "none";

    noImageElement.style.display =
        "block";

}


/* =========================================================
   ZOOM
========================================================= */

function applyZoom() {

    imageElement.style.transform =
        `scale(${currentZoom})`;

    zoomLevelElement.textContent =
        Math.round(
            currentZoom * 100
        ) + "%";

}


function zoomIn() {

    currentZoom =
        Math.min(
            currentZoom +
            ZOOM_STEP,
            MAX_ZOOM
        );

    applyZoom();

}


function zoomOut() {

    currentZoom =
        Math.max(
            currentZoom -
            ZOOM_STEP,
            MIN_ZOOM
        );

    applyZoom();

}


function resetZoom() {

    currentZoom =
        DEFAULT_ZOOM;

    applyZoom();

}


/* =========================================================
   DOUBLE CLICK
========================================================= */

imageElement.addEventListener(
    "dblclick",
    function() {

        currentZoom =
            currentZoom === DEFAULT_ZOOM
                ? 2
                : DEFAULT_ZOOM;

        applyZoom();

    }
);


/* =========================================================
   MOUSE WHEEL
========================================================= */

imageElement.addEventListener(
    "wheel",
    function(e) {

        e.preventDefault();


        if (e.deltaY < 0) {

            zoomIn();

        } else {

            zoomOut();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   PREVENT DRAG
========================================================= */

imageElement.addEventListener(
    "dragstart",
    function(e) {

        e.preventDefault();

    }
);


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {


        if (
            e.key === "+" ||
            e.key === "="
        ) {

            zoomIn();

            return;

        }


        if (
            e.key === "-"
        ) {

            zoomOut();

            return;

        }


        if (
            e.key === "0"
        ) {

            resetZoom();

        }

    }
);


/* =========================================================
   START
========================================================= */

loadItemImage();

</script>


</body>

</html>
