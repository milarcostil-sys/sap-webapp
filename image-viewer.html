<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ARCOSTEEL - Item Image</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #000000;

    color: #ffffff;

    overflow: hidden;

}


/* =========================================================
   PAGE
========================================================= */

.viewer-page {

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 18px;

    background: #000000;

}


/* =========================================================
   VIEWER CARD
========================================================= */

.viewer-card {

    position: relative;

    width: min(
        96vw,
        900px
    );

    height: min(
        94vh,
        850px
    );

    display: flex;

    flex-direction: column;

    background: #000000;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.12
        );

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 25px 80px
        rgba(
            0,
            0,
            0,
            0.85
        );

}


/* =========================================================
   HEADER
========================================================= */

.viewer-header {

    min-height: 68px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    padding:
        12px
        18px;

    background: #000000;

    border-bottom:
        1px solid
        rgba(
            255,
            255,
            255,
            0.10
        );

}


/* =========================================================
   ITEM INFO
========================================================= */

.viewer-item {

    display: flex;

    flex-direction: column;

    gap: 3px;

    min-width: 0;

}

.viewer-label {

    color: #8b949e;

    font-size: 11px;

    line-height: 1;

}

.viewer-code {

    color: #ffffff;

    font-size: 21px;

    font-weight: 700;

    direction: ltr;

    text-align: right;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================================================
   CLOSE BUTTON
========================================================= */

.close-btn {

    flex: 0 0 auto;

    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.15
        );

    border-radius: 10px;

    background: #111111;

    color: #ffffff;

    font-size: 21px;

    line-height: 1;

    cursor: pointer;

    transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;

}

.close-btn:hover {

    background: #222222;

    border-color:
        rgba(
            255,
            255,
            255,
            0.30
        );

    transform: scale(1.04);

}

.close-btn:active {

    transform: scale(0.97);

}


/* =========================================================
   IMAGE AREA
========================================================= */

.image-area {

    flex: 1;

    min-height: 0;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 22px;

    overflow: auto;

    background: #000000;

}


/* =========================================================
   IMAGE
========================================================= */

#itemImage {

    display: none;

    max-width: 100%;

    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    border-radius: 10px;

    transform-origin: center center;

    transition:
        transform 0.12s ease;

    user-select: none;

    -webkit-user-drag: none;

}


/* =========================================================
   LOADING
========================================================= */

.loading {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    color: #8b949e;

    font-size: 14px;

    white-space: nowrap;

}


/* =========================================================
   NO IMAGE
========================================================= */

.no-image {

    display: none;

    text-align: center;

    color: #8b949e;

}

.no-image-icon {

    font-size: 52px;

    margin-bottom: 12px;

}

.no-image-text {

    font-size: 15px;

}


/* =========================================================
   FOOTER
========================================================= */

.viewer-footer {

    min-height: 60px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    padding: 9px 12px;

    background: #000000;

    border-top:
        1px solid
        rgba(
            255,
            255,
            255,
            0.10
        );

}


/* =========================================================
   ZOOM BUTTONS
========================================================= */

.zoom-btn {

    min-width: 44px;

    height: 40px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding:
        0
        13px;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.12
        );

    border-radius: 10px;

    background: #111111;

    color: #ffffff;

    font-size: 18px;

    cursor: pointer;

    transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;

}

.zoom-btn:hover {

    background: #222222;

    border-color:
        rgba(
            255,
            255,
            255,
            0.25
        );

}

.zoom-btn:active {

    transform: scale(0.96);

}

.zoom-level {

    min-width: 56px;

    text-align: center;

    color: #c9d1d9;

    font-size: 13px;

    direction: ltr;

}


/* =========================================================
   MOBILE
========================================================= */

@media
(max-width: 600px) {

    .viewer-page {

        padding: 0;

    }


    .viewer-card {

        width: 100%;

        height: 100%;

        max-width: none;

        max-height: none;

        border: none;

        border-radius: 0;

    }


    .viewer-header {

        min-height: 62px;

        padding:
            10px
            12px;

    }


    .viewer-code {

        font-size: 18px;

    }


    .close-btn {

        width: 38px;

        height: 38px;

    }


    .image-area {

        padding: 10px;

    }


    .viewer-footer {

        min-height: 58px;

        padding:
            8px
            10px;

    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media
(max-width: 380px) {

    .viewer-footer {

        gap: 6px;

    }


    .zoom-btn {

        min-width: 40px;

        padding:
            0
            10px;

    }


    .zoom-level {

        min-width: 48px;

    }

}

</style>

</head>


<body>


<div class="viewer-page">


    <div class="viewer-card">


        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="viewer-header">


            <div class="viewer-item">

                <div class="viewer-label">
                    מק״ט
                </div>

                <div
                    class="viewer-code"
                    id="itemCode"
                >
                    -
                </div>

            </div>


            <button
                class="close-btn"
                type="button"
                onclick="closeViewer()"
                title="סגור"
            >
                ✕
            </button>


        </div>


        <!-- =================================================
             IMAGE AREA
        ================================================== -->

        <div class="image-area">


            <div
                class="loading"
                id="loading"
            >
                טוען תמונה...
            </div>


            <img
                id="itemImage"
                alt="Item image"
                draggable="false"
            >


            <div
                class="no-image"
                id="noImage"
            >

                <div class="no-image-icon">
                    🖼️
                </div>

                <div class="no-image-text">
                    לא נמצאה תמונה לפריט
                </div>

            </div>


        </div>


        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="viewer-footer">


            <button
                class="zoom-btn"
                type="button"
                onclick="zoomOut()"
                title="הקטן"
            >
                −
            </button>


            <div
                class="zoom-level"
                id="zoomLevel"
            >
                100%
            </div>


            <button
                class="zoom-btn"
                type="button"
                onclick="zoomIn()"
                title="הגדל"
            >
                +
            </button>


            <button
                class="zoom-btn"
                type="button"
                onclick="resetZoom()"
                title="איפוס"
            >
                ↺
            </button>


        </div>


    </div>


</div>


<!-- =====================================================
     API CONFIG
====================================================== -->

<script src="config.js"></script>


<script>

/* =========================================================
   SETTINGS
========================================================= */

let currentZoom = 1;

const ZOOM_STEP = 0.2;

const MIN_ZOOM = 1;

const MAX_ZOOM = 4;


/* =========================================================
   READ ITEM CODE FROM URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const itemCode =
    (
        params.get("item") || ""
    ).trim();


const itemCodeElement =
    document.getElementById(
        "itemCode"
    );


itemCodeElement.textContent =
    itemCode || "-";


/* =========================================================
   GET DOM ELEMENTS
========================================================= */

const loadingElement =
    document.getElementById(
        "loading"
    );

const imageElement =
    document.getElementById(
        "itemImage"
    );

const noImageElement =
    document.getElementById(
        "noImage"
    );

const zoomLevelElement =
    document.getElementById(
        "zoomLevel"
    );


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadItemImage() {


    if (!itemCode) {

        showNoImage();

        return;

    }


    const imageUrl =
        API_BASE +
        "/item-image/" +
        encodeURIComponent(
            itemCode
        );


    imageElement.onload =
        function() {

            loadingElement.style.display =
                "none";

            noImageElement.style.display =
                "none";

            imageElement.style.display =
                "block";

            resetZoom();

        };


    imageElement.onerror =
        function() {

            showNoImage();

        };


    imageElement.src =
        imageUrl;

}


/* =========================================================
   SHOW NO IMAGE
========================================================= */

function showNoImage() {

    loadingElement.style.display =
        "none";

    imageElement.style.display =
        "none";

    noImageElement.style.display =
        "block";

}


/* =========================================================
   APPLY ZOOM
========================================================= */

function applyZoom() {

    imageElement.style.transform =
        `scale(${currentZoom})`;

    zoomLevelElement.textContent =
        Math.round(
            currentZoom * 100
        ) + "%";

}


/* =========================================================
   ZOOM IN
========================================================= */

function zoomIn() {

    currentZoom =
        Math.min(
            currentZoom +
            ZOOM_STEP,
            MAX_ZOOM
        );

    applyZoom();

}


/* =========================================================
   ZOOM OUT
========================================================= */

function zoomOut() {

    currentZoom =
        Math.max(
            currentZoom -
            ZOOM_STEP,
            MIN_ZOOM
        );

    applyZoom();

}


/* =========================================================
   RESET ZOOM
========================================================= */

function resetZoom() {

    currentZoom = 1;

    applyZoom();

}


/* =========================================================
   DOUBLE CLICK ZOOM
========================================================= */

imageElement.addEventListener(
    "dblclick",
    function() {

        currentZoom =
            currentZoom === 1
                ? 2
                : 1;

        applyZoom();

    }
);


/* =========================================================
   MOUSE WHEEL ZOOM
========================================================= */

imageElement.addEventListener(
    "wheel",
    function(e) {

        e.preventDefault();


        if (e.deltaY < 0) {

            zoomIn();

        } else {

            zoomOut();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   PREVENT IMAGE DRAG
========================================================= */

imageElement.addEventListener(
    "dragstart",
    function(e) {

        e.preventDefault();

    }
);


/* =========================================================
   CLOSE VIEWER
========================================================= */

function closeViewer() {

    /*
        דפדפנים לא תמיד מאפשרים
        לסגור חלון שנפתח ישירות
        מקישור באקסל.

        לכן:
        1. מנסים window.close()
        2. אם לא נסגר - מנסים history.back()
    */


    window.close();


    setTimeout(
        function() {

            if (window.closed) {
                return;
            }


            if (
                window.history.length > 1
            ) {

                window.history.back();

            }

        },
        120
    );

}


/* =========================================================
   ESC CLOSE
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Escape") {

            closeViewer();

            return;

        }


        /*
            אפשר גם להשתמש במקלדת
            לזום
        */

        if (
            e.key === "+" ||
            e.key === "="
        ) {

            zoomIn();

        }


        if (
            e.key === "-"
        ) {

            zoomOut();

        }


        if (
            e.key === "0"
        ) {

            resetZoom();

        }

    }
);


/* =========================================================
   START
========================================================= */

loadItemImage();

</script>


</body>

</html>
